name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "engine/src/**", "engine/test/bot.ts", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "engine/src/**", "engine/test/bot.ts", ".github/workflows/server.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
